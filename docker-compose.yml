# docker-compose.yml — preliminary skeleton (Phase 3 will add full storage layer)
# Usage: make up / make down
version: "3.9"

# ─── Shared network ───────────────────────────────────────────────────────────
networks:
  fl-net:
    driver: bridge

# ─── Shared volumes ───────────────────────────────────────────────────────────
volumes:
  redis-data:
  minio-data:
  postgres-data:

services:
  # ── Infrastructure (Phase 3) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    networks: [fl-net]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks: [fl-net]
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: flpg123
      POSTGRES_DB: fl_registry
    networks: [fl-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/client-registry/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ── Go services (Phase 4+) — stubs, not yet built ──────────────────────────
  aggregation-server:
    build:
      context: .
      dockerfile: services/aggregation-server/Dockerfile
    networks: [fl-net]
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      postgres: {condition: service_healthy}
    profiles: ["services"]   # only start with: docker compose --profile services up

  client-registry:
    build:
      context: .
      dockerfile: services/client-registry/Dockerfile
    networks: [fl-net]
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["services"]

  orchestration:
    build:
      context: .
      dockerfile: services/orchestration/Dockerfile
    networks: [fl-net]
    depends_on:
      redis: {condition: service_healthy}
    profiles: ["services"]

  # ── Python ML services (Phase 5+) ──────────────────────────────────────────
  fedavg-engine:
    build:
      context: .
      dockerfile: services/fedavg-engine/Dockerfile
    networks: [fl-net]
    depends_on:
      minio: {condition: service_healthy}
    profiles: ["ml"]

  inference-server:
    build:
      context: .
      dockerfile: services/inference-server/Dockerfile
    networks: [fl-net]
    profiles: ["ml"]
