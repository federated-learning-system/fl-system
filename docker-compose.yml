# docker-compose.yml — FLS federated learning infrastructure + services
#
# Tiers:
#   infra:    redis, minio, postgres       — always up with `make up`
#   services: 8 FL services                — start with `docker compose --profile services up`
#   clients:  5 simulated FL clients       — via overlay: `make up-all`
#
# Usage:
#   make up           — infra only
#   make up-services  — infra + all 8 services
#   make up-all       — infra + services + 5 clients (uses infra/docker-compose.clients.yml)
#   make down         — tear down everything

networks:
  fl-net:
    driver: bridge

volumes:
  redis-data:
  minio-data:
  postgres-data:

# ── Shared environment anchors ────────────────────────────────────────────────
x-common-env: &common-env
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_ADDR: "redis:6379"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_ENDPOINT_RAW: "minio:9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: "flminio"
  MINIO_SECRET_KEY: "flminio123"
  MINIO_BUCKET_MODELS: "fl-models"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "fl_registry"
  DB_USER: "postgres"
  DB_PASSWORD: "flpg123"
  JWT_SECRET: "fl-dev-secret-change-in-prod"
  AGG_GRPC_ADDR: "aggregation-server:50051"
  REGISTRY_URL: "http://client-registry:8081"
  INFERENCE_URL: "http://inference-server:8000"

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # Infrastructure (always started)
  # ═══════════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    networks: [fl-net]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: flminio
      MINIO_ROOT_PASSWORD: flminio123
    networks: [fl-net]
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: flpg123
      POSTGRES_DB: fl_registry
    networks: [fl-net]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/client-registry/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ═══════════════════════════════════════════════════════════════════════════
  # Go services (profile: services)
  # ═══════════════════════════════════════════════════════════════════════════

  aggregation-server:
    image: aggregation-server:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
      TLS_CERT: "/certs/server.crt"
      TLS_KEY: "/certs/server.key"
      TLS_CA: "/certs/ca.crt"
      METRICS_PORT: "9100"
    ports:
      - "50051:50051"
      - "9100:9100"
    volumes:
      - ./infra/certs:/certs:ro
    depends_on:
      redis:    {condition: service_healthy}
      minio:    {condition: service_healthy}
      postgres: {condition: service_healthy}
    profiles: ["services"]

  client-registry:
    image: client-registry:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
    ports:
      - "8081:8081"
    depends_on:
      postgres: {condition: service_healthy}
    profiles: ["services"]

  orchestration:
    image: orchestration:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
      MIN_CLIENTS_PER_ROUND: "2"
      ROUND_INTERVAL_MINUTES: "60"
      TLS_CERT: "/certs/client-tech.crt"
      TLS_KEY: "/certs/client-tech.key"
      TLS_CA: "/certs/ca.crt"
    ports:
      - "8082:8082"
    volumes:
      - ./infra/certs:/certs:ro
    depends_on:
      redis: {condition: service_healthy}
    profiles: ["services"]

  straggler-watch:
    image: straggler-watch:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
    depends_on:
      redis: {condition: service_healthy}
    profiles: ["services"]

  websocket-push:
    image: websocket-push:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
    ports:
      - "8080:8080"
    depends_on:
      redis: {condition: service_healthy}
    profiles: ["services"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Python ML services (profile: services)
  # ═══════════════════════════════════════════════════════════════════════════

  fedavg-engine:
    image: fedavg-engine:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
      PENALTY_FACTOR: "0.5"
      MIN_CLIENTS: "2"
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    profiles: ["services"]

  inference-server:
    image: inference-server:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      minio: {condition: service_healthy}
    profiles: ["services"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Web frontend (profile: services)
  # ═══════════════════════════════════════════════════════════════════════════

  web-frontend:
    image: web-frontend:${IMAGE_TAG:-latest}
    networks: [fl-net]
    ports:
      - "3000:3000"
    depends_on:
      orchestration: {condition: service_started}
      inference-server: {condition: service_started}
    profiles: ["services"]

  # ═══════════════════════════════════════════════════════════════════════════
  # Hybrid service (profile: services)
  # ═══════════════════════════════════════════════════════════════════════════

  offload-worker:
    image: offload-worker:${IMAGE_TAG:-latest}
    networks: [fl-net]
    environment:
      <<: *common-env
    ports:
      - "8085:8085"
    depends_on:
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    profiles: ["services"]
