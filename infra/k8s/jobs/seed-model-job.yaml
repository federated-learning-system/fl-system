---
# infra/k8s/jobs/seed-model-job.yaml
#
# K8s Job that runs the model seed script to upload ONNX files to MinIO
# and write model metadata to Redis.
#
# Prerequisites:
#   - MinIO and Redis running in fl-system namespace
#   - fl-base-python image built (make build-python-base)
#   - ONNX model files available in the image or mounted volume
#
# Usage:
#   kubectl delete job seed-model --namespace fl-system --ignore-not-found
#   kubectl apply -f infra/k8s/jobs/seed-model-job.yaml
#   kubectl logs -n fl-system -l job-name=seed-model -f

apiVersion: batch/v1
kind: Job
metadata:
  name: seed-model
  namespace: fl-system
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure

      initContainers:
        # Wait for MinIO
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO..."
              until wget -qO- http://minio:9000/minio/health/live 2>/dev/null; do
                sleep 3
              done
              echo "MinIO ready."

        # Wait for Redis
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis-master 6379 2>/dev/null; do
                sleep 3
              done
              echo "Redis ready."

      containers:
        - name: seed
          image: fl-base-python:latest
          env:
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "flminio"
            - name: MINIO_SECRET_KEY
              value: "flminio123"
            - name: MODEL_VERSION
              value: "v1.0.0"
          command:
            - python
            - /app/ml/training/seed_model_store.py
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true

      volumes:
        # In production: mount from a PVC or bake into the image.
        # For local k3d dev, copy repo into a hostPath or use:
        #   kubectl cp . fl-system/seed-model-pod:/app
        - name: app-code
          emptyDir: {}
