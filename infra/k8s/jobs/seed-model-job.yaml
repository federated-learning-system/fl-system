---
# infra/k8s/jobs/seed-model-job.yaml
#
# K8s Job that runs the model seed script to upload ONNX files to MinIO
# and write model metadata to Redis.
#
# Prerequisites:
#   - MinIO and Redis running in fl-system namespace
#   - fl-seed-job image built and imported:
#       make build-seed-job
#       k3d image import fl-seed-job:latest -c fl-demo
#
# Usage:
#   kubectl delete job seed-model --namespace fl-system --ignore-not-found
#   kubectl apply -f infra/k8s/jobs/seed-model-job.yaml
#   kubectl logs -n fl-system -l job-name=seed-model -f

apiVersion: batch/v1
kind: Job
metadata:
  name: seed-model
  namespace: fl-system
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure

      initContainers:
        # Wait for MinIO
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for MinIO..."
              until wget -qO- http://minio:9000/minio/health/live 2>/dev/null; do
                sleep 3
              done
              echo "MinIO ready."

        # Wait for Redis
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until nc -z redis-master 6379 2>/dev/null; do
                sleep 3
              done
              echo "Redis ready."

      containers:
        - name: seed
          image: fl-seed-job:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_HOST
              value: "redis-master"
            - name: REDIS_PORT
              value: "6379"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_ACCESS_KEY
              value: "flminio"
            - name: MINIO_SECRET_KEY
              value: "flminio123"
            - name: MODEL_VERSION
              value: "v1.0.0"
          command:
            - python
            - ml/training/seed_model_store.py
          # No volumeMounts needed — all files baked into the image
