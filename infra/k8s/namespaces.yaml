# infra/k8s/namespaces.yaml
# Defines the fl-system and fl-monitoring namespaces with resource quotas
# sized for a 7.2 GB RAM / 8-thread Ryzen 7 3750H development laptop.
#
# Apply with: kubectl apply -f infra/k8s/namespaces.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── fl-system: all FL services (aggregation-server, fedavg-engine, etc.) ─────
---
apiVersion: v1
kind: Namespace
metadata:
  name: fl-system
  labels:
    app.kubernetes.io/managed-by: cluster-setup

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fl-system-quota
  namespace: fl-system
spec:
  hard:
    # Memory: 6 Gi requests, 7 Gi limits — leaves ~200 MB headroom for the OS
    # and k3d control-plane overhead on a 7.2 GB machine.
    requests.memory: "6Gi"
    limits.memory: "7Gi"
    # CPU: 6 requested, 8 max — Ryzen 7 3750H has 8 logical threads.
    requests.cpu: "6"
    limits.cpu: "8"
    # Pod cap prevents runaway horizontal scaling during FL round storms.
    pods: "30"
    services: "20"
    persistentvolumeclaims: "10"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: fl-system-defaults
  namespace: fl-system
spec:
  limits:
    - type: Container
      # Sane defaults so pods without explicit resource specs don't starve
      # their neighbours or monopolise the node.
      defaultRequest:
        memory: "128Mi"
        cpu: "100m"
      default:
        memory: "512Mi"
        cpu: "500m"
      max:
        memory: "3Gi"
        cpu: "4"

# ── fl-monitoring: Prometheus, Grafana ───────────────────────────────────────
---
apiVersion: v1
kind: Namespace
metadata:
  name: fl-monitoring
  labels:
    app.kubernetes.io/managed-by: cluster-setup

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fl-monitoring-quota
  namespace: fl-monitoring
spec:
  hard:
    # kube-prometheus-stack: operator(256Mi) + kube-state-metrics(256Mi)
    #   + prometheus(512Mi) + grafana+sidecar(512Mi) ≈ 1.5Gi limits
    requests.memory: "768Mi"
    limits.memory: "2Gi"
    requests.cpu: "500m"
    limits.cpu: "2"
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: fl-monitoring-defaults
  namespace: fl-monitoring
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: "64Mi"
        cpu: "50m"
      default:
        memory: "256Mi"
        cpu: "200m"
      max:
        memory: "2Gi"
        cpu: "2"
