---
# infra/k8s/services/websocket-push-deployment.yaml
#
# Deployment + Service for the WebSocket Push Service.
#
# Prerequisites:
#   - fl-configmap applied
#   - Redis running in fl-system namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-push
  namespace: fl-system
  labels:
    app: websocket-push
    app.kubernetes.io/part-of: fls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-push
  template:
    metadata:
      labels:
        app: websocket-push
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-master 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
      containers:
        - name: websocket-push
          image: websocket-push:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: fl-common-config
          env:
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-push
  namespace: fl-system
spec:
  selector:
    app: websocket-push
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
  type: ClusterIP
