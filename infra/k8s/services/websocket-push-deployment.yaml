---
# infra/k8s/services/websocket-push-deployment.yaml
#
# Deployment for the WebSocket Push Service.
#
# Prerequisites:
#   - Redis running in fl-system namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-push
  namespace: fl-system
  labels:
    app: websocket-push
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-push
  template:
    metadata:
      labels:
        app: websocket-push
    spec:
      containers:
        - name: websocket-push
          image: websocket-push:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: REDIS_ADDR
              value: "redis-master:6379"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-push
  namespace: fl-system
spec:
  selector:
    app: websocket-push
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
