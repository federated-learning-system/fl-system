---
# infra/k8s/services/inference-server-deployment.yaml
#
# Deployment + Service for the ONNX Inference Server.
#
# Prerequisites:
#   - fl-configmap, fl-credentials applied
#   - Redis and MinIO running in fl-system namespace
#   - Model seeded in MinIO + Redis

apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server
  namespace: fl-system
  labels:
    app: inference-server
    app.kubernetes.io/part-of: fls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-server
  template:
    metadata:
      labels:
        app: inference-server
    spec:
      containers:
        - name: inference-server
          image: inference-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fl-common-config
            - secretRef:
                name: fl-credentials
          env:
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: inference-server
  namespace: fl-system
spec:
  selector:
    app: inference-server
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
