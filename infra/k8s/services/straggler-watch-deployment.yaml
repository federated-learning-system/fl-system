---
# infra/k8s/services/straggler-watch-deployment.yaml
#
# Deployment + Service for the FL Straggler Watch service.
#
# Prerequisites:
#   - fl-configmap applied
#   - Redis running in fl-system namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: straggler-watch
  namespace: fl-system
  labels:
    app: straggler-watch
    app.kubernetes.io/part-of: fls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: straggler-watch
  template:
    metadata:
      labels:
        app: straggler-watch
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-master 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
      containers:
        - name: straggler-watch
          image: straggler-watch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: fl-common-config
          env:
            - name: METRICS_PORT
              value: "9100"
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: straggler-watch
  namespace: fl-system
spec:
  selector:
    app: straggler-watch
  ports:
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
  type: ClusterIP
