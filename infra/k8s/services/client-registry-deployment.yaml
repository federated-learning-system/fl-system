---
# infra/k8s/services/client-registry-deployment.yaml
#
# Deployment + Service for the FL Client Registry.
#
# Prerequisites:
#   - fl-configmap, fl-credentials applied
#   - PostgreSQL running in fl-system namespace

apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-registry
  namespace: fl-system
  labels:
    app: client-registry
    app.kubernetes.io/part-of: fls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-registry
  template:
    metadata:
      labels:
        app: client-registry
    spec:
      containers:
        - name: client-registry
          image: client-registry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: fl-common-config
            - secretRef:
                name: fl-credentials
          env:
            - name: PORT
              value: "8081"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: client-registry
  namespace: fl-system
spec:
  selector:
    app: client-registry
  ports:
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
