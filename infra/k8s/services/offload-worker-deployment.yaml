---
# infra/k8s/services/offload-worker-deployment.yaml
#
# Deployment + Service for the Offload Worker (Go API + Python Trainer).
#
# Prerequisites:
#   - fl-configmap, fl-credentials applied
#   - Redis and MinIO running in fl-system namespace
#   - Model seeded in MinIO

apiVersion: apps/v1
kind: Deployment
metadata:
  name: offload-worker
  namespace: fl-system
  labels:
    app: offload-worker
    app.kubernetes.io/part-of: fls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offload-worker
  template:
    metadata:
      labels:
        app: offload-worker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-master 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://minio:9000/minio/health/live 2>/dev/null; do
                echo "Waiting for MinIO..."
                sleep 3
              done
      containers:
        - name: offload-worker
          image: offload-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
            - containerPort: 9100
              name: metrics
          envFrom:
            - configMapRef:
                name: fl-common-config
            - secretRef:
                name: fl-credentials
          env:
            - name: PORT
              value: "8085"
            - name: TLS_ENABLED
              value: "false"
            - name: CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: offload-worker
  namespace: fl-system
spec:
  selector:
    app: offload-worker
  ports:
    - port: 8085
      targetPort: http
      protocol: TCP
      name: http
    - port: 9100
      targetPort: metrics
      protocol: TCP
      name: metrics
  type: ClusterIP
