---
# infra/k8s/services/fl-credentials-secret.yaml
#
# Opaque Secret holding credentials for MinIO, PostgreSQL, and JWT.
# Values are base64-encoded dev defaults — override for production.
#
# Apply with: kubectl apply -f infra/k8s/services/fl-credentials-secret.yaml
#
# To regenerate base64 values:
#   echo -n 'flminio' | base64        → ZmxtaW5pbw==
#   echo -n 'flminio123' | base64     → ZmxtaW5pbzEyMw==
#   echo -n 'postgres' | base64       → cG9zdGdyZXM=
#   echo -n 'flpg123' | base64        → ZmxwZzEyMw==
#   echo -n 'fl-dev-secret-change-in-prod' | base64 → ZmwtZGV2LXNlY3JldC1jaGFuZ2UtaW4tcHJvZA==

apiVersion: v1
kind: Secret
metadata:
  name: fl-credentials
  namespace: fl-system
  labels:
    app.kubernetes.io/part-of: fls
type: Opaque
data:
  # MinIO
  MINIO_ACCESS_KEY: ZmxtaW5pbw==
  MINIO_SECRET_KEY: ZmxtaW5pbzEyMw==
  # PostgreSQL
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: ZmxwZzEyMw==
  # JWT signing key (client-registry)
  JWT_SECRET: ZmwtZGV2LXNlY3JldC1jaGFuZ2UtaW4tcHJvZA==
