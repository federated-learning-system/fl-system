---
# infra/k8s/services/service-monitors.yaml
#
# ServiceMonitor CRDs for Prometheus Operator auto-discovery of all FL services.
# All services expose /metrics on port 9100 (named "metrics" in their Service specs).
#
# Prerequisites:
#   - kube-prometheus-stack (or Prometheus Operator) installed in fl-monitoring namespace
#   - Prometheus configured to watch ServiceMonitors in fl-system namespace
#     (via serviceMonitorNamespaceSelector or serviceMonitorSelector)

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aggregation-server
  namespace: fl-system
  labels:
    app: aggregation-server
    app.kubernetes.io/part-of: fls
    release: monitoring
spec:
  selector:
    matchLabels:
      app: aggregation-server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

